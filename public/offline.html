<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B2545" />
<title>Sunrich — No internet</title>
<style>
  html,body{margin:0;height:100%;background:#0B2545;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
  h1{font-size:22px;margin:8px 0 0}
  p{margin:0;opacity:.8;font-size:15px;line-height:1.5;max-width:300px}
  button{margin-top:12px;min-height:48px;min-width:160px;border:0;border-radius:12px;background:#2EA3C7;color:#0B2545;font-size:17px;font-weight:700}
  .logo{font-weight:800;letter-spacing:6px;font-size:28px}
</style>
</head>
<body>
<main>
  <div class="logo">SUNRICH</div>
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2EA3C7" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 9.5-2.6M8.5 16.4a5 5 0 0 1 5.4-.9M12 20h.01M2 2l20 20"/></svg>
  <h1>No internet</h1>
  <p>Please check your mobile data or Wi-Fi.<br/>इंटरनेट कनेक्शन जाँचें।</p>
  <button id="retry" type="button">Retry</button>
</main>
<script>
  // Local page shown by the Android shell when the site can't load.
  try { window.Capacitor && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide({ fadeOutDuration: 200 }); } catch (e) {}
  document.getElementById("retry").onclick = function () { location.href = "https://user.sunrich.in/"; };
  window.addEventListener("online", function () { location.href = "https://user.sunrich.in/"; });
</script>
</body>
</html>
